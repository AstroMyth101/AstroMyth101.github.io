name: Build check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site with Eleventy
        run: npm run build

      - name: Audit and browser readiness (temporary)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-security-audit.json || true
          node -e 'const a=require("/tmp/npm-security-audit.json"); console.log("AUDIT_SUMMARY",JSON.stringify({counts:a.metadata?.vulnerabilities,affected:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range})}))}));'
          echo "CHROME_BINARY_START"
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          echo "CHROME_BINARY_END"

      - name: Chromium smoke test (temporary)
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/assets/js/theme-init.js
          python3 -m http.server 8765 --directory _site >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /tmp/site-home.html
          grep -F 'script-src &apos;' /tmp/site-home.html >/dev/null || grep -F "script-src 'self'" /tmp/site-home.html >/dev/null
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom http://127.0.0.1:8765/ > /tmp/site-rendered.html 2>/tmp/chrome-stderr.log
          grep -Eq '<html[^>]*class="[^"]*js' /tmp/site-rendered.html
          grep -Eq '<html[^>]*data-theme="(dark|light)"' /tmp/site-rendered.html
          grep -q 'name="theme-color"' /tmp/site-rendered.html
          grep -q 'class="theme-toggle"' /tmp/site-rendered.html
          echo "BROWSER_SMOKE_SUCCESS"
          if grep -Ei '(Refused to execute|Content Security Policy|ERR_|Uncaught)' /tmp/chrome-stderr.log; then
            echo "BROWSER_CONSOLE_WARNING_FOUND"
          fi
