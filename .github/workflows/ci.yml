name: Build check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site with Eleventy
        run: npm run build

      - name: Audit and browser readiness (temporary)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-security-audit.json || true
          node -e 'const a=require("/tmp/npm-security-audit.json"); console.log("AUDIT_SUMMARY",JSON.stringify({counts:a.metadata?.vulnerabilities,affected:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range})}))}));'
          echo "CHROME_BINARY_START"
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          echo "CHROME_BINARY_END"
