name: Build check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile for PR repair (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"

      - name: Install dependencies
        run: npm ci

      - name: Build site with Eleventy
        run: npm run build
